<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TiffinConnect — Login</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<div class="auth-art"><div class="auth-glow"></div><div class="tiffin-3d big"><div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div><div class="tiffin-lid"></div><div class="tiffin-body"><span>TC</span></div><div class="tiffin-bottom"></div></div><div class="auth-quote">“A little taste of home<br><em>changes the whole day.</em>”</div></div>
<div class="auth-panel"><a class="brand" href="index.html"><span class="brand-mark">TC</span><span>Tiffin<span class="brand-accent">Connect</span></span></a>
<div class="role-switch"><button data-role="student">🎓 Student</button><button data-role="owner">👨‍🍳 Owner</button><button data-role="admin">👑 Admin</button></div>
<div class="auth-tabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Sign up</button></div>
<form id="authForm"><div id="nameField" class="field hidden"><label>Full name</label><input id="name" placeholder="Your name"></div>
<div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="••••••••"></div>
<div id="extraFields" class="hidden"><div class="field"><label>I am</label><select id="gender"><option value="girl">Girl</option><option value="boy">Boy</option></select></div><div class="field"><label>Food preference</label><select id="food"><option value="veg">Veg</option><option value="nonveg">Non-Veg</option></select></div></div>
<button class="btn btn-dark btn-wide" type="submit" id="submitBtn">Login <span>↗</span></button><p id="authMessage" class="form-message"></p></form>
<div class="demo-note"><b>Demo owner:</b> owner@tiffinconnect.com / Owner@123<br><b>Demo admin:</b> admin@tiffinconnect.com / Admin@123<br>Student accounts are stored in LocalStorage.</div></div>
<script src="app.js"></script><script>
let role=new URLSearchParams(location.search).get('role')||'student',signup=new URLSearchParams(location.search).get('mode')==='signup';
const loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),nameField=document.getElementById('nameField'),extra=document.getElementById('extraFields'),submit=document.getElementById('submitBtn'),msg=document.getElementById('authMessage');
function setMode(v){signup=v;loginTab.classList.toggle('active',!v);signupTab.classList.toggle('active',v);nameField.classList.toggle('hidden',!v||role!=='student');extra.classList.toggle('hidden',!v||role!=='student');submit.innerHTML=v?'Create account <span>↗</span>':'Login <span>↗</span>';if(role!=='student'&&v){signup=false;loginTab.classList.add('active');signupTab.classList.remove('active');}}
function setRole(r){role=r;document.querySelectorAll('.role-switch button').forEach(b=>b.classList.toggle('active',b.dataset.role===r));setMode(false);msg.textContent='';}
document.querySelectorAll('.role-switch button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));loginTab.onclick=()=>setMode(false);signupTab.onclick=()=>{if(role==='student')setMode(true)};setRole(role);if(role==='student')setMode(signup);
document.getElementById('authForm').onsubmit=e=>{e.preventDefault();const em=email.value.trim().toLowerCase(),pw=password.value;
if(role==='admin'){if(em==='admin@tiffinconnect.com'&&pw==='Admin@123'){setData('session',{role:'admin',email:em});location.href='admin.html'}else msg.textContent='Invalid admin credentials.';return}
if(role==='owner'){if(em==='owner@tiffinconnect.com'&&pw==='Owner@123'){setData('session',{role:'owner',email:em});location.href='owner.html'}else msg.textContent='Invalid owner credentials.';return}
if(signup){const users=getData('users',[]);if(users.some(u=>u.email===em)){msg.textContent='An account with this email already exists.';return}const u={id:Date.now(),name:name.value.trim()||'Student',email:em,password:pw,gender:gender.value,food:food.value,plan:null,created:new Date().toISOString()};users.push(u);setData('users',users);setData('currentUser',u);setData('session',{role:'student',userId:u.id});location.href='dashboard.html'}else{const u=getData('users',[]).find(x=>x.email===em&&x.password===pw);if(!u){msg.textContent='Incorrect email or password.';return}setData('currentUser',u);setData('session',{role:'student',userId:u.id});location.href='dashboard.html'}};
</script></body></html>
