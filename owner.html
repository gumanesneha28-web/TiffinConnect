<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TiffinConnect — Mess Owner</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="dashboard-page"><nav class="nav glass"><a class="brand" href="index.html"><span class="brand-mark">TC</span><span>Tiffin<span class="brand-accent">Connect</span></span></a><div class="nav-actions"><span class="owner-tag">MESS OWNER</span><button class="btn btn-ghost" onclick="logout()">Logout</button></div></nav>
<main class="dash-wrap"><div class="dash-head"><div><span class="eyebrow">OWNER CONSOLE</span><h1>Run your mess,<br><em>without the chaos.</em></h1><p>Published updates are visible to students for today only.</p></div><a href="index.html" class="btn btn-ghost">← Home</a></div>
<div class="stats-row"><div class="stat-card"><span>Registered students</span><b id="studentCount">0</b></div><div class="stat-card"><span>Veg today</span><b>42</b></div><div class="stat-card"><span>Non-Veg today</span><b>18</b></div><div class="stat-card"><span>Rating</span><b>4.8 ★</b></div></div>
<section class="owner-grid"><article class="dash-card"><span class="eyebrow">TODAY'S TIFFIN STATUS</span><h3>What should students see?</h3><div class="status-buttons"><button data-s="on-time" onclick="selectStatus('on-time')">🟢 On time</button><button data-s="delayed" onclick="selectStatus('delayed')">🟡 Delayed</button><button data-s="cancelled" onclick="selectStatus('cancelled')">🔴 Cancelled</button></div><div class="field"><label>Announcement message</label><textarea id="statusMessage" rows="4" placeholder="e.g. Lunch delayed by 30 minutes because of a kitchen issue."></textarea></div><button class="btn btn-dark btn-wide" onclick="saveStatus()">Publish today's update</button><button class="btn btn-light btn-wide clear-btn" onclick="clearTodayStatus()">Clear today's update</button><p id="ownerMsg" class="form-message"></p></article>
<article class="dash-card"><span class="eyebrow">TODAY'S MENU</span><h3>Update your menu</h3><div class="editable-menu"><label>Lunch</label><input id="lunch" value=""><label>Dinner</label><input id="dinner" value=""></div><button class="btn btn-dark btn-wide" onclick="saveMenu()">Save menu</button><p id="menuMsg" class="form-message"></p></article></section></main>
<script src="app.js"></script><script>requireRole('owner');let selectedStatus='on-time';const savedMenu=getData('menu',null);if(savedMenu){lunch.value=savedMenu.lunch;dinner.value=savedMenu.dinner}function selectStatus(s){selectedStatus=s;document.querySelectorAll('.status-buttons button').forEach(b=>b.classList.toggle('chosen',b.dataset.s===s))}function saveStatus(){const message=statusMessage.value.trim()||(selectedStatus==='delayed'?"Today's tiffin is delayed.":selectedStatus==='cancelled'?"Today's tiffin has been cancelled.":"Today's tiffin is running on time.");setData('tiffinStatus',{status:selectedStatus,message,date:new Date().toDateString(),time:new Date().toLocaleTimeString()});ownerMsg.textContent="Today's update published. It will automatically expire after today.";showToast("Student screens updated.");}function clearTodayStatus(){localStorage.removeItem('tiffinStatus');ownerMsg.textContent="Today's update cleared.";showToast("Update removed.");}function saveMenu(){setData('menu',{lunch:lunch.value.trim()||'Menu not updated',dinner:dinner.value.trim()||'Menu not updated',date:new Date().toDateString()});menuMsg.textContent='Menu saved for today.';showToast('Menu updated.');}</script></body></html>
